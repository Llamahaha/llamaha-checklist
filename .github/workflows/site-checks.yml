name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit content, metadata, navigation, and local links
        run: npm run check
      - name: Regenerate public guides
        run: npm run static-guides
      - name: Check generated guide consistency
        run: git diff --exit-code -- guides
